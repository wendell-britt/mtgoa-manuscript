# editorial_exceptions.yaml — accepted deviations, one sentence at a time.
#
# The target for every instrument below is ZERO. Every hit is a defect until a human decides one
# earns its place, and that decision is recorded here so the scanner stops counting it. The number
# coherence.py drives to zero is the UN-accepted hits.
#
# An entry is the offending SENTENCE (folded, so it survives the line moving) with a reason. When a
# kept sentence is later rewritten its entry stops matching, and coherence.py's `ledger` check
# flags it as stale so this file does not silently rot.
#
# WRITE THIS FILE WITH instruments/ledger.py, NOT BY HAND AND NOT WITH A SCRIPT THAT EDITS TEXT.
# On 2026-09-09 a `str.replace` on "trailing_and:" matched inside this very comment block, and the
# resulting file stopped parsing while the board still read `ledger ok clean`. See that module.
#
# Reasons belong in an entry's `reason:` field. A comment written above an entry is lost the next
# time this file is rewritten; the field is not.

polysyndeton:
- quote: Fear detects threat and risk, anger detects the obstacle to overcome or the boundary to draw,
    sadness points at what you care about and how far you have drifted from it, joy shows you what's aligned
    with your delight, neutrality gives you detachment and the view of the whole.
  reason: taxonomy, one clause per member — Five emotions, five jobs, one clause each. Every clause carries
    a distinct fact, and the parallel is what makes the set legible as a set.
- quote: The Challenger's cycle teaches you to *strike and then tend.* After the push you rest and let
    the field settle.
  reason: named technique — *strike and then tend* is the Challenger's cycle by name, italicised as a
    term of art. A term is not a sentence to be repaired.
- quote: The *I can see the whole board and you are playing one square of it and this conversation is
    beneath my time* that fires the moment you have to go down to where they are.
  reason: quoted interior voice — The Game-Switcher's rage, italicised as it fires. The chain is the escalation
    — each `and` is the contempt gathering. A calmer sentence would describe the state instead of producing
    it.
- quote: In *10,000 Hours of Play*, he describes the experienced player as the one who knows when to be
    serious and when to be playful, when to push and when to yield, when to stay and when to leave, from
    choice rather than default.
  reason: quoted source, deliberate anaphora — Chou's own sentence, quoted. The when/when repetition is
    the definition of the experienced player; flattening it would misquote him.
- quote: You can know you're mortal and the game is older than you and none of this will matter in a hundred
    years, and still care, not despite knowing, because of it.
  reason: rhetorical build to a turn — Three knowings stacked, then *and still care*. The build is what
    earns the turn; shortened, the turn arrives unpaid for.
- quote: I come back and notice that the chapter that had blocked me for three days unclogged the moment
    I stopped forcing it and let the Shaman name what was actually there.
  reason: shared-subject verb pair — One subject, two verbs — *I stopped forcing it and let the Steward
    take it*. Not two clauses.
- quote: They need your willingness to go first, not because you have all the answers, but because you
    have the map and the willingness to walk it and report back.
  reason: noun coordination — *the map and the willingness to walk it* is two nouns the reader is said
    to have. The clause test reads the infinitive after `willingness` as a predicate.
- quote: Name the decision as closed and you will still get the truth; leave it sounding open and you
    have spent their effort on a door that was never going to move.
  reason: antithesis — Two opposite moves with two opposite consequences, balanced across a semicolon.
    The symmetry is the teaching.
- quote: You say *here is what I think is happening, and I want to know if I'm right.* The move either
    works and the conversation opens, or the other person corrects you and you update.
  reason: 'parallel either/or: each branch pairs a move with its immediate result (it works, the conversation
    opens; the other person corrects you, you update); the two ands carry the branches'' symmetry, not
    a loose chain. My call, Wendell to ratify.'
