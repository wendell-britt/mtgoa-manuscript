# editorial.yaml — the project profile for the editorial pipeline.
#
# This is the ONE file that varies per project. The instruments under instruments/ are
# universal; this declares what is true of THIS book: its baselines, its banned voice words,
# what counts as its corpus, and which instruments run. review.py and coherence.py read it,
# and coherence.py validates it against reality (every baseline is re-measured, every named
# instrument must exist). A new project copies the instruments and writes its own file here.
#
# See specs/EDITORIAL_PIPELINE_COHERENCE_2026-09-03.md.

project: "Mastering the Game of Allyship"

# What "the book" means when an instrument runs book-wide. MTGOA's real corpus is assembled
# by build_book.SPINE (typeset order); these globs are the declared, portable statement of it.
corpus:
  - "manuscript/ch*.md"
  - "appendices/APPENDIX_*.md"
  - "appendices/ON_THE_SHOULDERS_OF.md"
  - "front_matter/*.md"
  - "back_matter/*.md"

# Measured on this book, never copied. coherence.py re-measures each and fails on drift > 0.4pt.
baselines:
  telling: 3.0        # % of sentences carrying a copula-label (LABEL tier)
  trailing_and: 12.4  # % of sentences that are loose (LOOSE tier). Was 13.9 until 2026-09-09:
                      # the ch2/ch3 proof-mark rework and the card cut took the book's loose
                      # rate down 1.5 points, and coherence.py flagged the drift. Re-measured.
  light_verb: 0.7     # % of sentences carrying a buried verb (DELEXICAL tier)

# This book's voice decisions, ruled by Wendell one at a time. Regex fragments; gate.py wraps
# each in word boundaries. Another project bans other words, or none.
banned:
  - "rooms?"
  - "quiet(ly|er|est)?"
  - "genuinely"
  - "things?"

# light_verb's DEAD/TRADE tiers surface an abstraction handed a physical verb. The instrument's
# generic abstraction list missed the nouns THIS book hands one to, so DL-97 (2026-09-10) added
# them here; folded into the shared core v32 on 2026-09-11, where the shape is universal and the
# vocabulary is the project's. Regex fragments, wrapped by the instrument. See profile.abstractions.
abstractions:
  - "feelings?"
  - "charge"
  - "readings?"
  - "alchemy"
  - "moves?"
  - "lines?"
  - "games?"
  - "standards?"
  - "limits?"
  - "costs?"
  - "work"
  - "practice"
  - "patterns?"
  - "distortion"
  - "exile"
  - "altitude"
  - "boundary"
  - "inheritance"
  - "terms"
  - "vigilance"
  - "clarity"
  - "impact"
  - "contact"
  - "connection"
  - "repair"
  - "conflict"
  - "discomfort"
  - "urgency"
  - "safety"
  - "belonging"
  - "competence"
  - "capacity"
  - "agency"
  - "aim"
  - "nerve"
  - "standing"
  - "leverage"

# light_verb's BORROWED tier: a verb lifted from another domain onto a feeling. *metabolize* was
# the marked instance, then ruled back IN by Wendell (DL-102, 2026-09-10: "keep metabolized") as
# emotional alchemy's own vocabulary. So the family is declared and then excluded, and the tier
# fires on nothing — a live record that the question was asked and answered.
light_verb_borrowed:
  - "metabolis?[zs]e[sd]?"
  - "metabolis?[zs]ing"
light_verb_borrowed_ruled_in:
  - "metabolize"
  - "metabolise"
  - "metabolized"
  - "metabolised"
  - "metabolizes"
  - "metabolises"
  - "metabolizing"
  - "metabolising"

# The universal prose scanners, in pass order. coherence.py checks each exists and is wired.
pass:
  - gate
  - prose_diet
  - fragment
  - antecedent
  - slop_shapes
  - trailing_and
  - telling
  - light_verb

# Components in the spine that are apparatus, not prose. Ruled 2026-09-10 (instrument
# reconciliation, step 2): the index is a list of terms and page pointers, and fragment.py read
# its 50 entries as 50 verbless sentences. Read by editorial-core's find_line (`exclude:`).
exclude:
  - "back_matter/index.md"

# Instruments welded to this book's ontology; they do not travel to other projects.
project_only:
  - agency_grep

# Ruled by Wendell 2026-09-10: boxed records are scored; their hits are ledger notes. Read by
# editorial-core v29+ (profile.scored_frames): lines inside a listed frame block are scanned as
# body prose. prose_diet.py reads the boxes on its own (its BLOCK no longer strips HANDBOOK).
scored_frames: [HANDBOOK]
