# agency_registry.yaml — The Healthy Animism Registry
# Canon per SPEC_AGENCY_TRACEABILITY_AUDIT_20260802 §C2.
#
# Lives in instruments/ rather than the spec's tools/ because this repo has no
# tools/ directory; instruments/ is where every measurement lives.
#
# STATUS 2026-08-02: W-1 and W-2 are RULED and CLOSED. E-1 is STANDING. W-3 and
# W-4 remain open.
# Wendell's method was to scan first and rule on evidence, and it paid: both
# rulings came out narrower than the spec proposed, and W-2's proposal turned
# out to be aimed at the wrong pronoun. See `open_rulings` below.
#
# C1 — The Traceability Rule: any entity may take an agentive verb if and only
# if its mechanism of action is on the page or in canon. The defect is not
# nonhuman agency. The defect is UNEARNED agency — attribution with no
# traceable mechanism.

meta:
  spec: SPEC_AGENCY_TRACEABILITY_AUDIT_20260802
  ruled_by: Wendell Britt
  date: 2026-08-02
  amendable_by: Wendell only
  outranked_by:
    - specs/SPEC_EMOTIONAL_ALCHEMY_CANON.md
    # RULED by Wendell 2026-08-03. C2 named DAEMON_CANON.md as superior canon
    # and this registry carried it with a MISSING FROM REPO marker. It is not
    # missing -- it is RETIRED. specs/MANUSCRIPT_FILE_CANON.md lists
    # `claude/DAEMON_CANON.md` under "Docs that are stale and will mislead you",
    # as carrying the retired 8-gate walk, the retired four-stage sequences and
    # the retired "jeppi" naming. Deferring to it would not have failed
    # silently; it would have reintroduced three retired systems.
    #
    # Replaced with the live sources. Canon points at the manuscript, not at a
    # retired planning doc.
    - manuscript/ch2.md            # the roster itself, ch2:270-420
    - specs/MANUSCRIPT_FILE_CANON.md   # its "Structural facts that are current"

# ---------------------------------------------------------------- verb classes
# §3. Severity ordering for UNLICENSED subjects:
#   perception > intention > speech > social-causal > causal
# Mechanical and directional on unlicensed subjects are low-severity — usually
# dead metaphor, not category error.

verb_classes:
  perception:
    severity: 1
    note: "shows/reveals are perception-class even when aimed outward"
    lemmas: [see, know, notice, show, reveal, tell, recognize, recognise,
             perceive, understand, realize, realise, observe, watch, detect,
             sense, remember, forget, learn, discover, spot,
             # Added 2026-08-03. The class had no `think` and no `believe` --
             # the two commonest cognition verbs in English -- so an entire
             # paragraph like ch5:165 ("the village truly BELIEVED it was doing
             # the right thing. The village THOUGHT loyalty was the same thing
             # as obedience...") returned zero findings. An abstraction
             # believing something is the purest form of the defect this audit
             # exists to catch. Hand count on the village block was 16 where the
             # net reported 3.
             think, believe, consider, assume, doubt, trust, wonder, suspect,
             conclude, imagine, expect, presume, reckon, figure]
  intention:
    severity: 2
    note: "the most dangerous class on unlicensed subjects"
    lemmas: [want, decide, promise, refuse, try, convince, intend, mean,
             choose, prefer, seek, aim, hope, expect, demand, insist, allow,
             permit, let, need, wish, plan, attempt, persuade]
  speech:
    severity: 3
    lemmas: [say, argue, whisper, insist, claim, declare, announce, state,
             ask, answer, reply, warn, admit, confess, explain, suggest,
             # Added 2026-08-03 alongside the cognition set.
             agree, concede, object, protest, deny]
  social-causal:
    severity: 4
    note: "the systemic-agency class; conditionally licensed at Grade 6 — NO. See grade 6."
    lemmas: [reward, punish, train, select, teach, invite, judge, forgive,
             blame, praise, shame, humiliate, exclude, include, welcome,
             betray, protect, abandon, demand, require, expect, permit,
             forbid, sanction, discipline, groom, condition]
  mechanical:
    severity: 6
    note: "mind-free by definition"
    lemmas: [convert, jam, pay, compound, reset, overlay, distort, fuse,
             route, meter, tally, score, cost, charge, drain, fill, spend,
             accumulate, multiply, divide, lock, unlock, gate, throttle]
  directional:
    severity: 6
    note: "current-model verbs"
    lemmas: [move, carry, rise, flood, point, flow, run, pull, push, draw,
             sink, climb, travel, head, turn, bend, spread]
  causal-bare:
    severity: 5
    note: "most forgivable; flag only in clusters"
    lemmas: [create, produce, shape, generate, make, cause, drive, force,
             leave, bring, give, put, set, build, form]
  pattern:
    severity: 7
    note: "the Grade 6 ceiling — residue verbs, no mind, no social act"
    lemmas: [concentrate, compound, correlate, accumulate, persist, recur,
             cluster, distribute, propagate, replicate, aggregate, skew]

# ---------------------------------------------------------------- grades
# §4. Licensed = may take these classes. Everything else at that grade is a
# violation and routes to an R-op.

grades:
  - id: 1
    name: Persons
    entities: [Heads, Bram Tull, Headmaster, ICAs, reader, author, I, you, we,
               they, he, she, Corin Ash, Sim Orrel, Vale, Voss, Quill, Orr,
               named characters, proper names, personal pronouns,
               # Added 2026-08-02. The population reading of the fables. R8 is
               # the conversion from grade 6 `the village` to this.
               the villagers, the people there, everyone at the table,
               # RULED by Wendell 2026-08-03. The six Faces plus the Player.
               # See `constraints` below -- they are ROLE NOUNS, and a role noun
               # takes the verbs of whoever fills the role.
               the Shaman, the Challenger, the Regent, the Architect,
               the Diplomat, the Sage, the Player]
    verb_classes: [perception, intention, speech, social-causal, mechanical,
                   directional, causal-bare, pattern]
    trace: >
      n/a for persons. For the Faces: role noun, and the occupant is the reader,
      a named Head, or a fable character.
    constraints: >
      THE FACES, ruled 2026-08-03. They had never been in this registry at any
      grade, so 127 Face-subject instances across 69 distinct verbs had never
      been scanned by anything. Only `Diplomat shadow` was listed, at Grade 2.
      The open question was recorded as "are the Faces Grade 2 or Grade 6", and
      the answer is neither.

      NOT GRADE 2. That grade is INTERIOR parts, and its own voice anchor is
      built on one: "I have a part of me I call Mr. Inadequate ... the Fixer is
      happy to take him" (VOICE_ANCHOR.md anchor 4, ch5:516). The Faces are not
      interior to anyone. They are modes any reader can occupy, and in the
      fables they are characters with independent biographies.

      NOT GRADE 6. That grade is pattern residue. A Face is not the residue of
      anything; it is a mode of acting.

      THEY ARE ROLE NOUNS, and a role noun takes the verbs of whoever fills the
      role -- the surgeon operates, the referee calls it. The book states the
      occupant outright at ch9:51: "you don't *become* one of them: you *move
      through* all of them, depending on what the moment requires." A map, not a
      menu. So C1 is satisfied directly, the mechanism being the person in the
      seat: the reader, a named Head (Maera Voss, Keeper of First Signals; Corin
      Ash, Master of the Clean No; Quill, Keeper of Continuance), or a character
      inside an origin fable.

      This also answers the census's own puzzle, "you cannot pluralize the
      Regent". Correct -- a role noun is already generic, and R8 has nothing to
      do here in either direction.

      THE ONE CONSTRAINT, which keeps Grade 1 from being a blank cheque: THE
      OCCUPANT MUST BE RECOVERABLE. If a Face acts where no person could be
      filling the seat, that is the flag. This is the test, not a verb-class
      list -- Grade 1 licenses every class, so a class list would say nothing.

      Known strain, recorded so a later pass does not think it found something:
      ch1:193, "the WAVE, which the Shaman hands you in Chapter 3", is the only
      instance in the book of a Face acting on the reader from outside the
      frame. It reads as "which Chapter 3 hands you". Licensed at Grade 1, not a
      defect, and the lone exception to the pattern.

      `Diplomat shadow` stays at GRADE 2. A shadow is an interior distortion,
      which is a different thing from the Face itself.

  - id: 2
    name: Animate parts
    entities: [Seven Daemons, Protector, Controller, Skeptic, "Fixer/Healer",
               Fixer, Healer, Emotional Body, Victim, Damaged Self,
               Vulnerable Child, Diplomat shadow, "a part of you",
               "the part that", inner critic]
    verb_classes: [perception, intention, speech, somatic,
                   # a fortiori, 2026-08-03 -- see constraints
                   mechanical, directional, causal-bare, pattern]
    trace: "IFS architecture; the roster is manuscript/ch2.md:270-420"
    roster:
      # RULED 2026-08-03. Taken from ch2 itself rather than from any planning
      # doc. Each daemon's stated Job is the boundary its verbs must stay
      # inside, which is what `constraints` has always required and never had a
      # live source for.
      Protector:       "To keep you alive. The body's embodied sense of self-preservation."
      Controller:      "Decides HOW you live. Sets the standard for good and bad."
      Skeptic:         "To doubt, so you don't get fooled."
      Fixer/Healer:    "To fix in both senses: repair what's broken, and hold something in place."
      Emotional Body:  "The seat of emotional life, where feeling gets processed into meaning."
      Victim:          "To win sympathy through stories."
      Damaged Self:    "To take the damage. Absorbs the hit so what it carries survives."
    constraints: >
      Verbs stay inside each daemon's canonical job, and `roster` above is now
      that job list, quoted from ch2. The embodied three (Protector, Emotional
      Body, Damaged Self) act SOMATICALLY, not verbally, per the ch2 roster
      ruling. Daemon inflation is a real risk: more than two R3 routings per
      daemon per chapter is a flag.

      ROSTER CORRECTED 2026-08-03. Three of the seven were missing from this
      list and were therefore invisible to the recall net at every grade:
      CONTROLLER (18 uses, the most-used daemon in the book, and heavily
      agentive -- "the Controller decides how you live", "the Controller rules
      the read inadmissible before you can speak"), SKEPTIC (14), and
      FIXER/HEALER (10). The Fixer's absence was the sharpest: it carries
      VOICE_ANCHOR.md anchor 4, "The Fixer is happy to take him", which that
      document names as the model of licensed interior agency. The registry's
      own exemplar was not in the registry.

      VULNERABLE CHILD is NOT one of the Seven and never should have been listed
      as though it were. MANUSCRIPT_FILE_CANON's structural facts: "Chapter 2's
      daemon roster carries seven, not eight -- the Vulnerable Child left with
      the gate walk." It survives in ch2 exactly once, at ch2:384, and not as a
      roster member: "at the center, the youngest part of you still waits: the
      Vulnerable Child, the player who should have been holding it the whole
      time." It KEEPS Grade 2, because it is still a named interior part and the
      grade is about that, not about roster membership. What changes is its
      trace: it is the part the Seven form around, not one of them, so the
      per-daemon job constraint does not apply to it and neither does the
      two-routings-per-chapter inflation rule.

      TWO STRUCTURAL FAULTS FOUND WHILE CORRECTING THE ROSTER. Both are FLAGGED
      FOR WENDELL, not fixed here, because both are substantive amendments
      rather than corrections.

      (a) `somatic` IS NOT A DEFINED VERB CLASS. This grade's verb_classes list
      names it, and the constraint above requires the embodied three to act
      "SOMATICALLY, not verbally", but there is no `somatic` entry in the
      verb_classes block and therefore no lemma list behind it. The rule has
      never been machine-checkable. Defining it needs an authored lemma set,
      which is Wendell's call.

      A FORTIORI, ruled by Wendell 2026-08-03. An entity licensed for a
      high-severity class is licensed for the MIND-FREE classes as well --
      mechanical, directional, causal-bare, pattern -- because if it can think
      it can move. Those four require no mind by the taxonomy's own notes
      ("mind-free by definition", "usually dead metaphor, not category error"),
      so flagging them on an entity already licensed to perceive or intend was
      the table contradicting itself.

      THE BOUNDARY, and why it is not strict severity ordering: a naive a
      fortiori from perception (severity 1) would license every class including
      SOCIAL-CAUSAL, and that is wrong. Social-causal needs a counterparty and a
      will directed at another party, which is an ADDITIONAL claim rather than a
      weaker one, and nothing about being able to think implies it. This is the
      same line E-1 draws for the channels -- delivery of signal versus exertion
      of pressure -- and it holds here for the same reason. Social-causal and
      speech stay restricted at both grades.

      What (b) said before it was ruled, kept because it is the evidence:

      (b) THIS GRADE LICENSED THE DANGEROUS CLASSES AND NOT THE HARMLESS ONES.
      verb_classes here is [perception, intention, speech, somatic] -- the three
      highest-severity classes in the taxonomy -- while mechanical, directional
      and causal-bare are absent. So a daemon may THINK and SPEAK but flags for
      MOVING. Adding the three missing daemons surfaced 13 findings and every
      one is this fault rather than a defect: "the Controller routes coordination"
      (mechanical), "the Fixer turns I might not be equal to this into a project
      plan" (directional), "the Healer costs you more" (mechanical), "the
      Skeptic is what makes you pressure-test it" (causal-bare). All licensed by
      any reading of C1, all flagged by the table.

      The general principle, if Wendell wants it applied: an entity licensed for
      a high-severity class is licensed a fortiori for the low-severity ones,
      because if it can think it can move. Grade 3 has the same shape and the
      same symptom -- 17 mechanical findings on channels, where "the charge
      accumulates" is exactly what a current does.

  - id: 3
    name: Living currents
    entities: [Fire, Water, Metal, Wood, Earth, the five channels, fear, anger,
               grief, joy, the channel, the current,
               # Added 2026-08-02: both are named channels the book uses
               # constantly and neither was in the list, so the first W-1 scan
               # under-counted until they went in.
               sadness, neutrality, the feeling, the charge]
    verb_classes: [directional, perception,
                   # a fortiori, 2026-08-03 -- see Grade 2's constraints for the
                   # reasoning and the boundary. Social-causal stays out, which
                   # is what leaves room for E-1 to be the narrow exception it is.
                   mechanical, causal-bare, pattern]
    verb_classes_partial:
      # W-1 RULED by Wendell, 2026-08-02: license `want`, not the class.
      intention: [want, seek, aim]
    trace: "current model, taught in ch3"
    constraints: >
      Full license activates once ch3 has taught the model. Pre-ch3 usage is
      light. The liturgical register ("Fear shows you what matters. Anger
      points to boundaries.") is this license at full power and is PROTECTED —
      it must never be flagged.

      W-1 ruling: `want` is legal because the current model defines each
      channel as a directed movement, and `wants` is the natural English word
      for a vector with an object — it names where the current is going, not
      what it thinks. `seek` and `aim` ride along as pure vector cousins.
      EVERY OTHER intention verb stays illegal: tries, decides, refuses,
      promises, convinces, means-to. Those ascribe deliberation, and a channel
      that deliberates is a channel with a mind.

      CORRECTION 2026-08-02: the W-1 analysis described the liturgical register
      as "all perception and directional". That was wrong. It runs on `teach`
      (social-causal, severity 4) and `says` (speech, severity 3), both of which
      outrank the intention class W-1 was arguing about. The W-1 ruling is
      unaffected -- the register still contains no intention verb, so licensing
      `want` costs the signature device nothing -- but the register is NOT
      inside Grade 3's licensed classes at all. It is an ontological exception.
      See `exceptions: E-1`.

      Note on verb SENSE, which cost the first two scans their accuracy:
      `mean` in the semantic sense ("fear meant something" = signified) is not
      an intention verb at all, and `show` in the intransitive sense ("the only
      place the pattern shows" = is visible) is not a perception verb. Check
      the sense before the lemma.

  - id: 4
    name: Machines
    entities: [Arcade, the arcade, tokens, tickets, scoreboard, the app,
               the machine, the cabinet, the prize counter, the joystick]
    verb_classes: [mechanical]
    trace: "arcade conceit"
    constraints: >
      Never perceives. Never wants. B6 stays banned verbatim — "the game can
      tell the difference" is illegal forever. Payout is legal forever.

  - id: 5
    name: The ship
    entities: [Calrunia, the Calrunia, the ship]
    verb_classes: [directional, holding]
    trace: "maritime register + frame fiction"
    constraints: >
      Nothing cognitive. Heads may in-fiction believe otherwise — that belief
      is theirs and belongs to Grade 1, not to the ship.

  - id: 6
    name: Patterns
    entities: [culture, the culture, institutions, the institution, The Game,
               the system, the systems, org structure, organizations, society,
               capitalism, patriarchy, "white supremacy", racism, sexism,
               ableism, the hierarchy, the structure, the norm, the norms,
               the pattern, the dynamic, the market, the economy, the company,
               the industry, the workplace, the team, the family, the school,
               # Added 2026-08-02 on Wendell's instruction, after the audit found
               # both used heavily and defined nowhere. Two agents refused to
               # grade "the village" rather than guess, which is C2 working.
               the village, the field]
    verb_classes: [pattern]
    trace: "patterns as residue of person-action"
    entity_notes:
      the field: >
        ch7's central conceit, ~40 agentive uses. Its mechanism IS on the page
        at ch7:359, rewritten 2026-08-02 under SPEC_FIELD_OF_BODIES: "what
        happens between people in relationship with each other… Everyone there
        makes it, and it lasts only as long as they are all still there."
        That is a source term, not a container: the people GENERATE it, which
        is a stronger C1 trace than the sentence this note used to quote.
        Under C1 it licenses pattern, directional and mechanical verbs. It does
        NOT license cognition: a thing that exists only because people are
        generating it cannot independently know, decide or trust. ~30 of its
        ~40 sites are therefore not defects; the ~9 cognition sites route to
        R6. Note the same sentence now also rules the PREPOSITIONS — a field
        has an "at" and a "between", never an "in" or an "inside" — which is a
        metaphor-coherence matter rather than an agency one, tracked in the
        spec.
      The Game: >
        RULED BY WENDELL 2026-08-02, closing the AMBIGUOUS-REFERENT rows for
        `the game`. His words: "I think some instances of game can teach —
        since games have rules there is a teaching component. This is a big
        aspect of Mastering the Game of Allyship. I'm not teaching people to be
        allies. I'm teaching people how to gamify the allyship practice they
        already have in a way that leads to more satisfaction for them and the
        people they want to help."

        This is C1 satisfied rather than an exception to it. A game's mechanism
        of teaching is its RULES, and the rules are on the page: a game states
        what a move costs, shows what a move produced, and lets the move be
        made again. That is a traceable teaching mechanism, which is exactly
        what C1 asks for and what `culture` and `the system` cannot supply.

        So `teach` is LICENSED for the game, along with the feedback verbs that
        constitute the teaching where the loop is described in the same breath
        — gives, shows, lets, points to. This is a narrow license on a
        mechanism, not a general promotion: the game does not know, want,
        decide, refuse or believe, and it does not reward or punish, which are
        the Grade 6 verbs the constraint below names.

        WHY THIS ONE MATTERS MORE THAN ITS SITE COUNT. The book's thesis is
        that allyship must be gamified to be learnable. A rule that forbids the
        game from teaching would forbid the book from stating its own argument.

        STILL OPEN, not covered by this ruling: `needs`, at ch2 "A game also
        needs a somewhere" — an intention verb, and the ruling above is about
        teaching. Reads as a structural requirement rather than a wish, but
        C2 reserves the call.
      the village: >
        Singular collective standing in for a population. This is the Grade 6
        reading and the one the audit repairs. The SAME word read as a
        population is Grade 1 — see grade 1 `the villagers` — and R8 is the
        conversion between them. Where "the village" means the settlement
        rather than the people, it is a place and takes neither: see R8
        pre-flight check 3.
    constraints: >
      PERCEPTION, INTENTION, AND SOCIAL-CAUSAL ARE ALL ILLEGAL AT THIS GRADE.
      Culture does not train, reward, or punish. People do those things, and
      the pattern is the name for what their doing leaves behind. Social-causal
      verbs on Grade 6 subjects convert via R1 or R6. Per the C1 corollary this
      demotion IS the book's argument enacted in grammar; the argument is made
      explicitly on the page (W-4).

    entity_partial:
      # RULED by Wendell 2026-08-03. NOT a grade-wide license -- Grade 6's other
      # entities (the game, the culture, the system, organizations) keep the
      # pattern-verbs-only ceiling. This is `the field` alone.
      #
      # SPEC_FIELD_OF_BODIES_2026-08-02 made the field physical: it is generated
      # by the bodies present, exists between them and nowhere else, and stops
      # existing when they leave. ch7:359 now reads "Everyone there makes it."
      # A thing like that legitimately pushes and carries, the way a magnet
      # pulls without having a brain. Filing it with the leftovers of what
      # people did was the wrong shelf.
      #
      # SIX VERBS, NOT TWO CLASSES. The first proposal was to license
      # `directional` + `mechanical` outright, about forty verbs. Wendell
      # rejected it on his own W-1 precedent -- license `want`, not the
      # intention class -- and he was right twice. These are the six that
      # actually appear on the page. A seventh force verb in new prose FLAGS,
      # and somebody looks at it, which is the point: the sentence where a field
      # pushes is the sentence most likely to be hiding a person who pushed.
      #
      # Still barred at every strength: perception, intention, speech,
      # social-causal. A field does not learn, allow, ask or answer.
      #
      # WHY, stated properly. Wendell 2026-08-03, correcting the loose version
      # of this ("a field has no brain"):
      #
      #   "People in the field can learn how the field responds, but learns is a
      #    higher order word and the field is a lower order entity. It's a UR
      #    low level phenomenon, and a LR quantum experience."
      #
      # In AQAL terms the field sits in the RIGHT-HAND quadrants -- exterior,
      # UR as an observable phenomenon and LR as the interobjective space
      # between bodies -- and at a LOW level within them. Learning, allowing,
      # asking and answering are LEFT-HAND capacities: they need interiority,
      # and they belong to higher levels than a field occupies. Attributing one
      # to the field is a LEVEL confusion, not merely a missing mechanism.
      #
      # This is sharper than the brain test and it generalises. It also
      # explains the severity ladder this registry already had: perception,
      # intention and speech rank most severe precisely because they are
      # interior verbs, and mechanical and directional rank least severe
      # because they are exterior. The ladder was always a left/right gradient;
      # nobody had said so.
      #
      # THE REPAIR DIRECTION FOLLOWS FROM IT. The verb does not get deleted, it
      # gets returned to whoever holds it. The people in the field learn; the
      # field responds. Every site below is repaired by finding the person the
      # capacity belongs to, never by flattening the sentence.
      the field: [carry, move, push, fill, run, turn]


  - id: 7
    name: Shame and stuck states
    entities: [shame, worry, rage, despair, guilt, anxiety, dread, resentment,
               contempt, the freeze, the shutdown, burnout, "the stuck"]
    verb_classes: [mechanical]
    verb_classes_via_grade_2: [perception, intention, speech]
    trace: "jammed-token model / IFS routing"
    constraints: >
      Legal as a jammed-token MECHANISM, or at full license when routed
      through a part (Grade 2) as an internalized voice. ILLEGAL as a social
      agent — shame does not punish, reward, or promise. Those verbs belong to
      Grade 1 persons, with shame as the residue their doing leaves behind.

  - id: 0
    name: Unlicensed
    entities: [the framework, frameworks, this chapter, the chapter, the book,
               the model, the concept, the idea, "the work", "the practice",
               "the process", "the approach", "the method", "the theory",
               "the research", "the data", "the argument", "the section"]
    verb_classes: []
    trace: none
    constraints: >
      Authorial metonymy ("this chapter asks", "the book returns to") pends
      W-2. Tag, do not resolve.

# ---------------------------------------------------------------- ambiguity
disambiguation:
  game:
    note: >
      At least four referents share the token. The scan cannot disambiguate.
      EVERY "game"-subject hit routes to human triage tagged AMBIGUOUS-REFERENT.
    referents:
      - {sense: "the arcade conceit", grade: 4}
      - {sense: "The Game as systemic dynamic", grade: 6}
      - {sense: "the RPG companion product", grade: 0}
      - {sense: "the app's game system", grade: 4}

# ---------------------------------------------------------------- registers
# In-world documents authored by Heads are Grade 1 persons speaking in
# character. A category error there may be characterization, not defect.
# Ledger separately; never fold into chapter counts.
registers:
  - block: MARGINALIA
    tag: CHARACTER-VOICE
    scanned: false          # out of scope this pass (Wendell, 2026-08-02)
  - block: EPIGRAPH-BYLINE
    tag: CHARACTER-VOICE
    scanned: false
  - block: POSTCARD
    tag: CHARACTER-VOICE
    scanned: false
  - block: HANDBOOK
    tag: HANDBOOK-REGISTER
    scanned: true
    note: "Not stripped by MARG_BLOCK. In-world School admissions specs, Head-authored."
  - block: SIGNATURE
    tag: HANDBOOK-REGISTER
    scanned: true

  # RULED by Wendell 2026-08-03: "keep all 16, log the ruling."
  - block: HEADING
    tag: DISPLAY-REGISTER
    scanned: false
    note: >
      Markdown headings are display type, not prose claims, and are OUT OF SCOPE
      for the agency audit at every grade. agency_grep.py already skips lines
      beginning with `#`; this entry makes that intentional rather than
      incidental.

      The ruling was taken on the village headings, which are the whole
      population of the question -- 16 across the manuscript, and no other
      abstraction holds a heading anywhere in the book. Zero converted.

      THE REASON, which generalises past the village: a heading names the
      PATTERN and the body beneath it names the PEOPLE. That is C1's own
      formulation -- patterns don't teach, people do, and the pattern is what
      their teaching leaves behind. So "What the Village Does With Tradition"
      sitting above a body that says "the villagers" is not a mismatch left over
      from the R8 pass. It is the model working, with the signpost at pattern
      altitude and the claim at person altitude.

      The 16 are three different things, and only one of them was ever arguable:

      ARENA (4) -- ch2:166, ch4:374, ch5:496, ch6:349. "Forest vs Village",
      "Run the 30-Second Protocol in the Village". This is the book's central
      polarity, where the Village is the place a move costs something and the
      Forest is where it costs nothing. Never a candidate, and converting one
      would be a category error, not a style choice.

      FABLE FORMULA (10) -- ch3, ch4, ch5, ch6, ch8, two each:
        "Why the [Face] Left the Village (And What the Village Lost)"
        "What the Village Does With [X] When the [Face] Is Gone"
      Only the second of each pair carries agency at all. "Left the Village" is
      locative and was never a defect. So the real question was five headings of
      one formula, not sixteen.

      MYTHIC COUNTERPART (2) -- ch9:610, ch9:672. "The Village Is Already
      Playing" is the last place the book states Player against Village,
      singular against singular, two screens from the end.

      Worth recording that the book had already answered this itself. ch7 has no
      village heading anywhere, and ch9's own fable headings dropped the word --
      "Why the Player Left (And What They Carried With Them)", not "Left the
      Village". The formula was five chapters, never the book, and the closing
      chapter had already walked away from it.

# ---------------------------------------------------------------- remediation
# C5 precedence, highest first. Where several apply to one site, take the
# highest-priority op that fits.
r_ops:
  - id: R4
    priority: 1
    name: Testimony
    move: "Pull into the author's chair, first person, per A0."
    trigger: "Any site where the convincing/knowing actually happened in Wendell's head."
    risk: none
  - id: R8
    priority: 2
    name: Pluralize the collective
    move: "Change the number. Keep every other word unless grammar forces it."
    trigger: >
      A fictional collective whose members are persons takes a perception,
      intention, speech or social-causal verb. "The village learned" becomes
      "the villagers learned" — the subject moves from Grade 6 to Grade 1 and
      is then licensed for every class.
    added: "2026-08-02, after six stress tests across every village surface"
    measured: "~122 in-scope sites, 10 outright breaks, ~8%. Range 0% (ch7 parable, glossary) to 19% (ch4)."
    preflight:
      # ANY hit routes elsewhere. Four checks, three of them found by testing
      # rather than predicted.
      1_possessive_or_reflexive: >
        Does the collective act on or contain its own members (its, itself)?
        "it taught its people" cannot become "the villagers taught their
        people." Reflexives are the same trap in different grammar: "the
        village never saw itself doing this" pluralizes into a grammatical
        sentence that asserts a quietly weaker claim. → R6 or compression.
      2_is_it_a_population: >
        Does the noun name a practice, document, place, medium, role or
        emotion? workshops, rituals, stories, the pattern, loyalty, leadership,
        organizations — none has a number to change. → R1, R2 or R6.
      3_place_or_people: >
        Does the sentence mean the settlement rather than the inhabitants?
        "the village becomes a museum", "the village's boundaries", "than the
        village extended" all break. Where one sentence uses the word both
        ways, fix it whole, never clause by clause.
      4_density: >
        More than two in a paragraph, or more than four in a section? Variation
        is MANDATORY, not taste. A licensed noun drumbeating is still a
        drumbeat — ch8 produces four "the villagers" in nine sentences under a
        mechanical pass.
    variation_set: >
      Full noun on first mention · pronoun continuation · the passage's own
      concrete nouns (people there, the room, everyone at the table) · no one /
      nobody for negation-class sites. Derived from ch8; the prose already
      reaches for it unaided at ch8:87 and ch5:153/157/161.
    verification: >
      SYLLABLE COUNT IS NOT SUFFICIENT. Three of the ten known breaks are
      metrically silent (ch4:68, ch5:70, ch5:171), and the read-aloud pass the
      voice system tells editors to trust cannot see them. Every R8 site is
      checked for meaning-drift against the original.
    risk: >
      Not cheaper than R1 at volume — measured, it costs the same editorial
      attention, differently shaped. What it buys is a licensed subject, not a
      smaller job. Do not quote the "96 to 25" estimate without this caveat.

  - id: R1
    priority: 3
    name: Restore human agent
    move: "Abstraction's social verb becomes the persons who did it, with the pattern as residue."
    trigger: "Primary op for Grade 6/7 social-causal violations."
    risk: >
      STYLISTIC ONLY, not political. At scale, identical "people do X to each
      other" constructions drumbeat into scolding, which violates
      critical-discomfortment-not-scolding. Vary the construction, prefer R4
      where the author's chair can carry it, profile-check R1-heavy batches.
  - id: R3
    priority: 4
    name: Route to a part
    move: "Reassign the mind-verb to the daemon it belongs to."
    trigger: "Perception/intention that is really internal experience."
    risk: "Daemon inflation. >2 per daemon per chapter is a flag. Verbs must match the daemon's canonical job."
  - id: R2
    priority: 5
    name: Mechanize
    move: "Perception/intention verb on a Grade 4/6/7 subject becomes a structural mechanism."
    trigger: "Mind-verb on a machine or system."
    risk: "None. The house's proven move — the Token/Ticket ruling."
  - id: R6
    priority: 6
    name: Dissolve to transmission
    move: "Rewrite the system's action as its transmission path — the persons, incentives, and trained parts the effect travels through."
    trigger: "Grade 6 social-causal where naming individual actors would be false precision."
    risk: "Added length. Run against the AC-4 profile check."
  - id: R5
    priority: 7
    name: Demote to function
    move: "wants becomes moves toward / is built to"
    trigger: "Only if W-1 rules against channel intention."
    risk: "Flatness. The liturgical passages are protected regardless."
  - id: R7
    priority: 8
    name: Licensed keep
    move: "Log in the keep-ledger with justification."
    trigger: "Deliberate device."
    risk: >
      C3: NO automated check and NO Claude judgment may rule a keep. The
      pipeline's authority ends at sorting and flagging. Machine and Claude
      dispositions may be `fix` or `parked`, NEVER `keep`. Keep-candidates
      queue to Wendell's read-aloud pass and carry his dated ruling.

# ---------------------------------------------------------------- severity tiers
tiers:
  3: "perception or intention on a Grade 0/4/5/6/7 subject; any social-causal on Grade 6/7"
  2: "speech on an unlicensed subject; social-causal on Grade 0/4/5; causal-bare in a cluster"
  1: "mechanical or directional on an unlicensed subject; isolated causal-bare"

# ---------------------------------------------------------------- open rulings
# ------------------------------------------------------------ sense exceptions
# RULED by Wendell 2026-08-03, after the same problem cost four separate blocks.
#
# A lemma names a WORD. A class names a SENSE. The taxonomy conflates them, so
# every verb here sits in a class that is right for one of its senses and wrong
# for the one the book uses. Each was caught by reading, recorded as a note, and
# then raised again by the next scan, because a note in prose is not something
# an instrument can read.
#
# Where the sense has a clean syntactic test, the net now clears it outright.
# Where it needs judgement, the net tags it SENSE-CHECK so a reader knows the
# site has been seen before rather than meeting it fresh.

sense_exceptions:

  - verb: mean
    classed_as: intention
    wrong_because: >
      `mean` is in the intention list because of "I MEAN TO do X". The book uses
      the semantic sense almost everywhere -- "fear meant something", "anger
      meant something", "Redesigning the game means moving the same work onto
      the other set". That is SIGNIFIES, and signifying is not intending.
    rule: "intention sense requires a following `to`; without it the sense is semantic"
    action: clear
    found_in: [W-1 ch3:56, W-1 ch3:101, ON_THE_SHOULDERS_OF:70]

  - verb: ask
    classed_as: speech
    wrong_because: >
      "Fire asks for agency" is not Fire speaking. `ask for` means CALLS FOR, the
      same sense as "this dish asks for salt". The speech sense is `ask` with a
      question or a person as object.
    rule: "followed by `for` -> calls-for sense, not a speech act"
    action: clear
    found_in: [ch4:670, the ch7 field read]

  - verb: answer
    classed_as: speech
    wrong_because: >
      "Where fear answers to imposter syndrome" means GOES BY THE NAME OF. No
      speech act occurs.
    rule: "followed by `to` -> named-as sense"
    action: clear
    found_in: [ch3:150]

  - verb: show
    classed_as: perception
    wrong_because: >
      "the only place the pattern shows" is intransitive and means IS VISIBLE.
      The perception sense is transitive -- something shows something to someone.
    rule: >
      the perception sense is TRANSITIVE -- something shows something. Bare, or
      followed by an adverbial, it means is-visible: "the pattern shows nowhere
      else", "The pattern shows fully", "shows up". The first draft of this rule
      tested only for bare-or-`up` and missed both real sites.
    action: clear
    found_in: [the Grade 6 batch]

  - verb: require
    classed_as: social-causal
    wrong_because: >
      "Do the work the game requires" is structural entailment, the same as "the
      recipe requires flour". No mind, no counterparty, no pressure exerted on
      anyone. But `require` on a structure CAN be a real social act -- a system
      that requires you to file three forms is a system exerting -- so this one
      does not clear on syntax alone.
    rule: "on grades 4, 6 and 7 the entailment reading is the common one"
    action: tag            # SENSE-CHECK, not cleared
    found_in: [ch8:381]

# ---------------------------------------------------------------- exceptions
# Carve-outs that sit OUTSIDE the grade system rather than inside it. A grade
# says which verb classes an entity may take. An exception says a device is
# constitutive of the book's argument, so the Traceability Rule is satisfied by
# the thesis itself rather than by a mechanism in the local passage.
#
# Exceptions are Wendell-only. Do not add, widen, or infer one.

exceptions:
  E-1:
    name: The education-by-emotions register
    ruled_by: Wendell Britt
    date: 2026-08-02
    status: STANDING
    basis: >
      Ontological, not stylistic-only. The book's thesis is that emotions
      educate -- ch3:207 states it outright: "Other practices manage emotions.
      Other practices optimize them. This one is the education by emotions."
      A channel that teaches is therefore not unearned agency. The mechanism is
      the argument of the book, which satisfies C1 at the level of the whole
      work rather than the local sentence. Grading it as a severity-4
      social-causal violation inverts the relationship: it would flag the thesis
      for being stated.
    licensed_verbs: [teach, say, report]
    licensed_shape: >
      The channel DELIVERS A TRUE CONTENT ABOUT THE PERSON'S OWN STATE OR
      VALUES. That is the whole of it. "Fear teaches you what you actually care
      about." "Sadness says: this was true." The channel is a source of
      information about its bearer.
    still_illegal: >
      The channel exerting SOCIAL FORCE ON ANOTHER PARTY. A channel may not
      reward, punish, judge, blame, shame, invite, forbid, permit, demand of, or
      require of anyone. It may not argue, insist, claim, warn, persuade or
      concede. Those verbs need a counterparty and a will, and neither is in the
      model. The line is delivery-of-signal versus exertion-of-pressure, and it
      is not negotiable by resemblance -- `teach` being legal does not make
      `train` legal, and `say` being legal does not make `insist` legal.
    scope_is_the_device_not_a_line_range: >
      E-1 travels with the device, not with ch3. It covers ch9:380 ("The fear
      does not say don't do this. The fear says this matters enough to be
      afraid of.") and ch4:674 ("a defence answers an accusation and Water made
      a report") on the same grounds as the ch3 block, because all three are the
      channel delivering a true content about its bearer.
    sites:
      # Every instance in the manuscript, from a full sweep of social-causal and
      # speech verbs against all Grade-3 entities. Nine sites, three verbs. No
      # other social-causal or speech verb touches a channel anywhere in the
      # book, which is why this reads as a device under control rather than as
      # leakage.
      - ch3:138  "They forgot how to let sadness teach."
      - ch3:199  "fear teaches you what you actually care about"
      - ch3:201  "anger teaches you where you are willing to stand"
      - ch3:203  "sadness teaches you what was real"
      - ch3:203  "Sadness says: this was true. This connection was real."
      - ch3:205  "joy teaches you what is aligned"
      - ch4:222  "what is this anger teaching me"
      - ch4:674  "a defence answers an accusation and Water made a report"
      - ch9:380  "The fear does not say / The fear says"
    handling: NEVER FLAG. Not an R-op. Not a W-question. Do not convert.
    precedence: >
      E-1 OUTRANKS SPEC_JORDAN_METAPHOR_ARC_CH1_CH3_2026-08-02.md section 5,
      [METAPHOR_OVERREACH] "Feelings are information for inquiry, not messages
      with fixed meanings", which requires that a feeling be framed as something
      to investigate rather than obey and names "deliver a message" phrasing as
      the risk.

      The two documents were written the same day and pull opposite ways on the
      same sentences. The Jordan spec was drafted from master, which did not
      carry this exception. Wendell ruled 2026-08-03: "sadness says stands as
      ontology, E-1 wins."

      So the liturgical register keeps its authority-voice. `teach`, `say` and
      `report` on a channel are not hedged, softened, or given a corrigibility
      qualifier. "Sadness says: this was true. This connection was real." ships
      as written.

      What the Jordan spec still governs, because the ruling did not reach it:
      the ETHICAL_GAP in the same section, on "Name the channel out loud"
      becoming an unauthorized diagnosis in unequal-power settings. That is
      about the reader naming a channel in someone ELSE, which is a different
      act from a channel delivering a content about its own bearer. E-1 says
      nothing about it and does not shield it.
    near_misses:
      # Caught by the sweep, cleared on SENSE rather than on E-1. Recorded so a
      # later pass does not re-flag them and then wrongly file them under E-1.
      - ch3:150  "fear answers to imposter syndrome" -- `answers to` = goes by
                 the name of, not a speech act
      - ch4:670  "Fire asks for agency" -- `asks for` = calls for / requires,
                 the same sense as "this dish asks for salt", not a speech act

open_rulings:
  W-1:
    status_final: RULED 2026-08-02 — license `want` only, not the class
    question: "Do the five channels get intention verbs?"
    proposal: >
      `wants` is legal for channels because the current model defines each
      channel as a directed movement, so "wants" describes vector, not
      psychology.
    status: RULED
    ruling: >
      License `want` (plus `seek`, `aim`). All other intention verbs stay
      illegal. 7 sites found: 3 stand under the license, 3 cleared on verb
      sense (`meant` = signified), 2 converted. The liturgical register never
      once reaches for an intention verb across its 15-18 instances, so the
      signature device was never at stake either way.
    handling: "CLOSED. Converted in instruments/agency_w1.py."
    propagates_to: "canon EA docs"
  W-2:
    status_final: RULED 2026-08-02 — narrow license, navigation only
    question: >
      Does the book/chapter get a minimal discourse license (covers, returns
      to, asks) as standard authorial metonymy, or does everything convert to
      the author's chair?
    proposal: "Convert to `I` per A0; the author's chair is the book's authority engine."
    status: RULED
    ruling: >
      Narrow license. The book and chapter may take mechanical and directional
      verbs for structural navigation (covers, returns to, points to, put,
      handed, left). They may NOT take perception, intention, speech or
      social-causal verbs (asks, teaches, needs, wants, names, proposes, says).
      The conversion target is not automatic: -> `you` where the sentence is
      about what the reader gained, -> `I` where it is about a choice the
      author made. 22 sites, 11 to `you`, 8 to `I`, 1 re-verbed as navigation.
      The proposal to send everything to `I` was wrong for the largest group:
      "This book has been teaching you" makes the book the agent and the reader
      the seat, when the true subject is the reader.
    handling: "CLOSED. Converted in instruments/agency_w2.py and agency_w2b.py."
  W-3:
    question: "Print scope severity cutoff."
    proposal: >
      Perception + intention verbs on unlicensed/violating subjects in the
      nine shipping chapters; all else parked to edition two.
    status: UNRULED
    handling: "Fix-phase only. Does not gate this analysis pass."
  W-4:
    question: "Placement of the confrontation beat (the C1 corollary dependency)."
    proposal: >
      A Game So Far beat — systemic language as the Diplomat shadow's hiding
      place ("the culture here is toxic" said instead of "Dave, you interrupted
      her three times"; the abstraction absorbs the confrontation the Diplomat
      is avoiding).
    status: UNRULED
    handling: >
      Ship-phase only. This pass reports WHERE the Grade-6 violations cluster,
      which is evidence toward placement.
