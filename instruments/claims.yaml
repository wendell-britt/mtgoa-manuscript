# claims.yaml — the machine-readable half of specs/DECISION_LOG.md.
#
# Built 2026-09-09 to spec/SPEC_CLAIMS_REGISTRY_2026-09-09.md. The decision log holds sixty-plus
# ruled entries with a Location column and had no consumer anywhere in the repo, so a ruling was
# re-checked by nobody the moment the prose moved under it. This file is keyed by the log's own
# ids — there is no second id space — and `claims.py` fails a run when a ruled fact's prose drifts.
#
# THE TWO CENSUSES, which are not the same number and must never be conflated:
#
#   applied   the spans that had to CHANGE to land the ruling. Closed the moment the ruling
#             script runs. An incomplete application (N < M) is a shipcheck blocker.
#   carriers  the spans that CARRY the fact from now on and must not drift. Open forever.
#             Drift fails review.py and coherence.py and never stops a press, because it is
#             ambiguous between a broken ruling and an improved sentence with a stale entry.
#
# CLAIM vs CANDIDATE. An entry with `ruled_by` is a claim and fails the run. An entry without one
# is a candidate: a census somebody took that nobody has ruled. Candidates report and never fail,
# because taking a census is a measurement rather than an authority.
#
# CARRIERS ARE PHRASES, NEVER LINE NUMBERS. Line numbers rot on the next insertion, and a false
# failure is how a check gets switched off. A carrier is the shortest DISTINCTIVE span — short
# enough to survive rewording that keeps the fact, distinctive enough not to collide. Those two
# pull against each other: "twenty cards" looked like a good short carrier for the card cut and
# matches "a hundred and twenty cards" on the enrollment page, which is the product deck and not
# the cut mechanic. Prefer a span with a proper noun or a full clause in it.
#
# SCOPE RECORDS THE METHOD, NEVER THE TERRITORY. No entry may say it is complete. `scope` says
# what search was run and what was read, so the next person can re-run it and find an eleventh.

claims:

  - id: DL-78
    fact: >
      The Controller decides how you behave once you are inside. Whether you go in at all is the
      Protector's gate. Its shadow therefore bites at Open Up, the second move, and not before
      Wake Up.
    wrong_because: >
      Three of the four spans that had to change carried the old fact entirely in metaphor — onto
      the field, out of bounds at the whistle, made it into play — and shared no word with the
      sentence that stated it. A search for the claim found one span of four, which is how the
      paragraph came to contradict itself.
    applied: "4 of 4"
    ruled: 2026-09-09
    ruled_by: >
      Wendell, on the first application: "nonsense sentence." Fact ruled by the six-Face panel,
      round 5, six of six. See specs/PANEL_PROOF_MARKS_6FACE_2026-09-09.md.
    scope: >
      Every file matching the string `Controller decides`, plus ch3 sections 5 and 6 read in full,
      because the metaphor carriers match no search. Ten spans found by that method on 2026-09-09.
      The spec said eleven; the measurement said ten, and the measurement is what is recorded here.
    carriers:
      - file: manuscript/ch2.md
        phrase: "the Controller decides *how* you live"
      - file: manuscript/ch3.md
        phrase: "The Controller decides how."
      - file: manuscript/ch3.md
        phrase: "stops it at Open Up"
      - file: manuscript/ch3.md
        phrase: "It rules on your conduct rather than on the charge"
      - file: manuscript/ch3.md
        phrase: "which is Open Up"
      - file: manuscript/ch4.md
        phrase: "The Controller decides how you may behave once you get inside"
      - file: manuscript/ch5.md
        phrase: "The Controller decides how you may behave once you are inside"
      - file: manuscript/ch6.md
        phrase: "The Controller decides how you may behave once you get inside"
      - file: manuscript/ch7.md
        phrase: "The Controller decides how you may behave once you are inside"
      - file: manuscript/ch8.md
        phrase: "The Controller decides how you're allowed to behave once you're inside"

  - id: DL-83
    fact: >
      The book does not carry a deck of twenty cards. The Face chapters teach moves, and the
      reader's record is the character sheet and the six quests.
    wrong_because: >
      A removal has no carrier to guard. Nothing in the corpus states the fact, so the only way to
      protect the ruling is to name the phrases that must not come back. The section headings are
      the durable handle; the phrase "twenty cards" is not, because it is a substring of "a hundred
      and twenty cards" on the enrollment page, which is the product deck and stays.
    applied: "3 of 3"
    ruled: 2026-09-09
    ruled_by: >
      Wendell: "It's too much and isn't adding things." Cut applied across ch3-ch9 by
      cut_cards_ch3.py, cut_cards_ch4_9.py and cut_cards_residue.py.
    scope: >
      The three section headings the cut removed, searched across the whole declared corpus.
      Reinstatement of the mechanic under new headings would not be caught by this entry.
    forbidden:
      - "Your Twenty Cards"
      - "Drawing Against the Shadow"
      - "From Card to Quest"

  - id: DL-84
    fact: >
      Chapter section headings carry no construction scaffolding. The reader never sees a numbered
      section label or a stage name borrowed from the model the chapters were built against.
    wrong_because: >
      The scaffolding survived multiple revisions because it looked like structure rather than
      like a defect. Wendell, on the proof: "'Section 1: Urgency' is a stupid heading that's a
      holdout from when I was creating the chapters based on the Kotter model. It doesn't mean
      anything to a reader and yet it snuck into multiple revisions."
    applied: "70 of 70"
    ruled: 2026-09-09
    ruled_by: "Wendell, on the printed proof, 2026-09-09."
    scope: >
      Every H2 in manuscript/ch2.md through ch9.md, rewritten by strike_scaffolding.py, and every
      in-prose reference to a numbered section. headings.py guards the heading shape continuously;
      this entry guards the label vocabulary.
    forbidden:
      - "## Section 1:"
      - "## Section 2:"

  # ---------------------------------------------------------------------------------------
  # The banned words. These four were ruled one at a time by Wendell and lived in editorial.yaml
  # as bare patterns with no id and no reason beside them, so the argument for each was recoverable
  # only from a person's memory. gate.py is the enforcer and stays the enforcer — it carries the
  # carve-outs, and a second, dumber scanner here would disagree with it. What these entries check
  # is that the RULE IS STILL DECLARED: delete a pattern from editorial.yaml and the ruling dies
  # silently today, and fails this check from now on.

  - id: DL-79
    fact: "The word `rooms` is banned from this book's prose."
    wrong_because: >
      The ban exists to force a sentence to be rebuilt. A synonym satisfies the counter and evades
      the work, which is how `quiet` became `careful` in a sentence where careful means nothing.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29. Plural form ruled the same day."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "rooms?"

  - id: DL-80
    fact: "The word `quiet`, in every inflection, is banned from this book's prose."
    wrong_because: >
      This is the ruling that produced the repo's standing example of evasion. The sentence wanted
      "the table goes quiet", the ban blocked it, and "careful" went in instead — a word that does
      not collocate with `go` and so means nothing. The gate passed clean over it.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "quiet(ly|er|est)?"

  - id: DL-81
    fact: "The word `genuinely` is banned from this book's prose."
    wrong_because: >
      An intensifier that asserts sincerity is the shape of a sentence that has not earned it.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "genuinely"

  - id: DL-82
    fact: "The word `thing`, singular and plural, is banned from this book's prose."
    wrong_because: >
      Wendell: "It's not in my writing style to use the word 'thing' because of how unspecific it
      is." Promoting it to the banned counter is what made the empty-head defect visible at all —
      the body went to zero and the gate still failed on twenty-eight sites in the appendices,
      which had never been held to the standing list.
    applied: "1 of 1"
    ruled: 2026-07-31
    ruled_by: "Wendell, 2026-07-31."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "things?"

  # =========================================================================================
  # CANDIDATES — censused 2026-09-09, not ruled. No `ruled_by`, so claims.py reports these and
  # never fails on them, and they never reach the press check. These are the four proof marks
  # held for Wendell: the census is done so that whichever way he rules, the ruling can be
  # applied to every span at once instead of to the one that states it.
  #
  # `proposed_fact` is my reading of what each mark implies. It is not a ruling and the wording
  # is the part most likely to be wrong. `applied` is absent on purpose: nothing has been
  # applied, and a candidate carrying `0 of 6` would have blocked the press on a decision that
  # has not been made. That was found by writing this block.

  - id: DL-85
    proposed_fact: >
      A treatise is framed where the reader enters it, not only signed where they leave it. Six
      chapters put the reader inside a Head's voice for three sections and identify the speaker
      afterwards, in the signature.
    wrong_because: >
      The signature is the mark, and the signature is not the defect. It is the first place the
      reader learns whose voice they have been in, which is work the entry should have done, so
      the line that closes the treatise is carrying the weight of the line that never opened it.
      Nothing at any of the six entry points names the speaker: ch3 goes from the author's framing
      straight into Section 1, and ch4 through ch8 go from a marginalia block straight into it.
    proof_mark: "p.62, the SIGNATURE line under Maera Voss's treatise"
    scope: >
      Every `<!-- SIGNATURE -->` block in manuscript/ch3.md through ch8.md, and the four lines
      above each `<!-- SECTION 1 -->` anchor in the same six files, read on 2026-09-09. Six exits
      carry an attribution; six entries carry none. The convention is stated in
      specs/SPEC_TWO_HANDS_2026-07-30.md: sections 1-3 are the Head's treatise, 4-7 are the
      author. seam_sweep.py already guards the membrane between them and says nothing about
      whether the reader was told where it is.
    note: >
      The carriers below are the six signatures, which is what exists. If the ruling is to frame
      the entry, this entry gains six more carriers at the entry points and the applied count is
      6 of 6.
    carriers:
      - {file: manuscript/ch3.md, phrase: "the first treatise, submitted by Maera Voss"}
      - {file: manuscript/ch4.md, phrase: "the second treatise, submitted by Corin Ash"}
      - {file: manuscript/ch5.md, phrase: "the third treatise, submitted by Sera Quill"}
      - {file: manuscript/ch6.md, phrase: "the fourth treatise, submitted by Irix Vale"}
      - {file: manuscript/ch7.md, phrase: "the fifth treatise, submitted by Elian Cross"}
      - {file: manuscript/ch8.md, phrase: "the sixth treatise, submitted by Thalen Orr"}

  - id: DL-86
    proposed_fact: >
      A verb does not arrive after a subject the reader can no longer hold, and a pronoun does
      not reach back across a sentence boundary into a subordinate clause for its noun.
    wrong_because: >
      The ledger read this mark as "deposits one" and flagged it partial, so only the tail was
      captured. Reading the sentence explains the tail. Forty-one words of subject run before the
      verb arrives, and the verb is a banking metaphor introduced at the moment it is used. Its
      object, "one", points back past a sentence boundary to "a piece of evidence" inside a
      relative clause. The mark is on the last two words because that is where the sentence
      finally fails, not where it went wrong.
    proof_mark: "p.81, '...deposits one.' [partial]"
    scope: >
      manuscript/ch3.md, the paragraph at what is now line 675, read in full on 2026-09-09.
      Not searched book-wide: the shape is a sentence-level defect rather than a stated fact, so
      a census of other sites needs cadence.py or antecedent.py rather than a phrase search, and
      neither flagged this one.
    carriers:
      - {file: manuscript/ch3.md, phrase: "with your nerve telling you to let it go, deposits one"}

  - id: DL-87
    proposed_fact: >
      The section "What You Take Out of the Forest" needs rebuilding rather than repairing. Its
      marked sentences were reworded and the handwritten instruction against the whole section
      was not carried out.
    wrong_because: >
      This is the one mark that is not a sentence. Wendell wrote "Rework" by hand against the
      section, and five of its lines were separately highlighted. The five were changed in
      tranches t10 and t11 and the section note was read as their sum. **A note against a section
      is a scope, and applying it sentence by sentence is the same error as DL-78 one level up:**
      the ruling was applied where it was stated rather than where it reached.
    proof_mark: "p.83, handwritten 'Rework' against the whole section, plus five marked lines"
    scope: >
      manuscript/ch3.md, the section heading through the rule before the next SECTION anchor,
      read in full on 2026-09-09. Four spans below: the heading, and the three reworded lines
      still traceable to marks. The fourth marked line, "the read let all the way in", now reads
      "the reading let all the way in" and is not carried as a span because the rework changed it.
    carriers:
      - {file: manuscript/ch3.md, phrase: "### What You Take Out of the Forest"}
      - {file: manuscript/ch3.md, phrase: "The rule won, which is a referee doing its job"}
      - {file: manuscript/ch3.md, phrase: "What you take out is what your Controller is for."}
      - {file: manuscript/ch3.md, phrase: "Keeping their rule is how you earn clearance with it."}

  - id: DL-88
    proposed_fact: >
      Undetermined. The mark itself is unconfirmed.
    wrong_because: >
      The ledger flags this one `[?]`: a low-confidence read of the highlight, so it is not
      certain the line was marked at all. Two readings are available and they point opposite
      ways. Either the invented particular is doing nothing — eleven days is a number the passage
      never uses — or the closing hedge is the defect, since "I have thought about it more than
      is useful" comments on the anecdote instead of ending it. **The line is inside a marginalia
      block, which is a traveller's journal in another hand, and invented particulars are
      legitimate there in a way they are not in the teaching voice.** That is the argument for
      leaving it alone, and it is why this one cannot be ruled from the mark.
    proof_mark: "p.56, marginalia, 'We were there eleven days.' [?]"
    scope: >
      manuscript/ch3.md, the marginalia block at lines 92-101, read in full on 2026-09-09.
      The ledger's own standing offer applies: "Wendell: correct any misread line and I will fix
      the ledger." This candidate is the ledger asking.
    carriers:
      - {file: manuscript/ch3.md, phrase: "We were there eleven days."}
