      the clause it reaches back to is "reached the face that could change it".
    proof_mark: "none — found by instruments/article.py, PRO tier, ch3:685 and ch3:693"
    scope: >
      All 11 PRO sites in manuscript/ch3.md, read in context on 2026-09-09. Nine are licensed and
