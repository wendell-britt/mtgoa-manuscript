  - id: DL-94
    fact: >
      The handbooks do not price a move with "It cost you X". Each of the 24 "You're winning
      when" entries names its price as its own sentence, with the reader as subject, a real verb
      and a plain object, and no two constructions repeat inside a chapter.
    applied: "24 of 24"
    ruled_by: >
      Wendell, 2026-09-09, twice. First on the clause: "it cost is the problem here. Pronoun
      collapsing against a weak word pointing at something almost tangible." Then on my proposed
      uniform repair: "you gave up is just replacing one tired phrase with another. We need to
      vary the way we say things. I do think the grammar is now correct but we need variation."
      And on the joins: "modify the dangling ands."
    wrong_because: >
      Three defects in four words. **"It"** reaches back to a whole clause rather than a noun.
      **"cost"** is a weak verb doing metaphorical accounting. **The object** is a half-
      abstraction — "the position of the reasonable one", "your standing as", "their read of you
      as" — and the three go soft together. **The book proved it itself:** of 24 cost lines, 23
      name a status you stop having and exactly one names a countable thing (ch6:619, "a
      fortnight of arguing"), and that one reads clean on the same pronoun and the same verb.
      **The uniformity was a second defect wearing the first one's clothes**, which is why the
      first repair was refused.
    proof_mark: "none — ruled on the clause, after three rounds on the object"
    scope: >
      All 24 "You're winning when" entries in manuscript/ch3.md through ch8.md, found by pattern
      and each read with its move clause on 2026-09-09. Three further matches of "it cost you"
      are ordinary prose, not handbook prices (ch4:544 and ch7:584 in quoted dialogue, ch5:491 in
      a BAR instruction) and are deliberately untouched. **Twelve of the 24 were embedded as
      ", and it cost you…" hanging off a sixty-word move clause and all twelve become their own
      sentence.** "The proof is that" stays uniform in all 24 as the entry's anchor.
    forbidden: [", and it cost you"]
    carriers:
