    carriers:
      - {file: manuscript/ch3.md, phrase: "the sentence she had not said still sitting in her chest"}
      - {file: manuscript/ch3.md, phrase: "Three years of correct words had never asked him"}
      - {file: manuscript/ch3.md, phrase: "Allyship is saying what a part of you has already felt"}
    superseded_in_part_by: >
      DL-92, the same day. Two of the three spans were rewritten again because the noun this entry
