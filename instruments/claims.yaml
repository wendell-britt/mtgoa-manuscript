    applied: "3 of 3"
    ruled_by: >
      Wendell, 2026-09-09, on my saying I would not touch the chapter's landing without him:
      "this is a dumb reason not to fix an obvious problem. weenie shit again. Change it it
      doesn't make any sense out of context and I don't think it made sense IN context either.
      stop inventing sacred cows to seem sophisticated."
    wrong_because: >
      "the true one" is the construction removed from "What You Take Out of the Forest" forty
      lines below, left standing twice in the parable above it, once at the chapter's landing.
      The pro-form carries nothing and its nearest noun is "the beautiful words" and "the right
      words" — plural, and the wrong thing besides. **Its actual referent, "one true sentence",
