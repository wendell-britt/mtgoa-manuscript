      - "## Section 2:"

  # ---------------------------------------------------------------------------------------
  # The banned words. These four were ruled one at a time by Wendell and lived in editorial.yaml
  # as bare patterns with no id and no reason beside them, so the argument for each was recoverable
  # only from a person's memory. gate.py is the enforcer and stays the enforcer — it carries the
  # carve-outs, and a second, dumber scanner here would disagree with it. What these entries check
  # is that the RULE IS STILL DECLARED: delete a pattern from editorial.yaml and the ruling dies
  # silently today, and fails this check from now on.

  - id: DL-79
    fact: "The word `rooms` is banned from this book's prose."
    wrong_because: >
      The ban exists to force a sentence to be rebuilt. A synonym satisfies the counter and evades
      the work, which is how `quiet` became `careful` in a sentence where careful means nothing.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29. Plural form ruled the same day."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "rooms?"

  - id: DL-80
    fact: "The word `quiet`, in every inflection, is banned from this book's prose."
    wrong_because: >
      This is the ruling that produced the repo's standing example of evasion. The sentence wanted
      "the table goes quiet", the ban blocked it, and "careful" went in instead — a word that does
      not collocate with `go` and so means nothing. The gate passed clean over it.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "quiet(ly|er|est)?"

  - id: DL-81
    fact: "The word `genuinely` is banned from this book's prose."
    wrong_because: >
      An intensifier that asserts sincerity is the shape of a sentence that has not earned it.
    applied: "1 of 1"
    ruled: 2026-07-29
    ruled_by: "Wendell, 2026-07-29."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "genuinely"

  - id: DL-82
    fact: "The word `thing`, singular and plural, is banned from this book's prose."
    wrong_because: >
      Wendell: "It's not in my writing style to use the word 'thing' because of how unspecific it
      is." Promoting it to the banned counter is what made the empty-head defect visible at all —
      the body went to zero and the gate still failed on twenty-eight sites in the appendices,
      which had never been held to the standing list.
    applied: "1 of 1"
    ruled: 2026-07-31
    ruled_by: "Wendell, 2026-07-31."
    scope: "The pattern as declared in editorial.yaml's banned list; enforcement is gate.py's."
    declared_in: editorial.yaml
    declares: "things?"

  # =========================================================================================
  # CANDIDATES — censused 2026-09-09, not ruled. No `ruled_by`, so claims.py reports these and
  # never fails on them, and they never reach the press check. These are the four proof marks
  # held for Wendell: the census is done so that whichever way he rules, the ruling can be
  # applied to every span at once instead of to the one that states it.
  #
  # `proposed_fact` is my reading of what each mark implies. It is not a ruling and the wording
  # is the part most likely to be wrong. `applied` is absent on purpose: nothing has been
  # applied, and a candidate carrying `0 of 6` would have blocked the press on a decision that
  # has not been made. That was found by writing this block.

  - id: DL-85
    fact: >
      There are no treatises in this book. The admissions page is the only document a Head wrote,
      and each Head signs it inside its own box. Everything outside the boxes is the author's, and
      the margin annotates this book.
    wrong_because: >
      ch2:577 promised "six chapters, each opening with a treatise by the person who runs one of
      the six schools: their method, in their voice, carrying their bias and their quarrel with
      the other five." Sections 1-3 are the fable, the concept and the Polarity Map, in the book's
      own voice, addressing the reader as "you" 81 times in ch3's 2,810 words. **The claim had ten
      carriers, all ten agreed with each other, and none agreed with the prose** — which is why it
      read as a voice problem rather than an error. Two of the marginal three went further and
      named a Head as the author of a sentence in the fable.
    proof_mark: "p.62, the SIGNATURE line under Maera Voss's treatise"
    applied: "10 of 10"
    ruled: 2026-09-09
    ruled_by: >
      Wendell: "I think we should change the promise... the admissions page IS the treatise. There
      aren't any treatises anywhere in the book." And on the last open question: "the margin is
      annotating this book." Panel: specs/PANEL_CHANGE_THE_PROMISE_6FACE_2026-09-09.md.
    scope: >
      Case-insensitive search for `treatise` across the whole declared corpus on 2026-09-09: ten
      occurrences, one in ch2's running prose, six in SIGNATURE frames, three in MARGINALIA. Front
      matter, back matter and the appendices carry none. Plus ch2, ch3, ch4, ch5 and ch7 read in
      full with every box stripped, which is what established that the sections are not treatises.
    note: >
      **The signature move is not a reversal of the 2026-07-30 ruling.** A submitted document is
      still signed at the end of itself. What changed is which document: the admissions page,
      which the Head wrote and which opens "Admissions. Filed as required." The sign-off sits
      inside that box, where the Headmaster's letter already puts its own.
      **The margin was ruled to annotate this book**, which retires the question of what in-world
      document it was written in. It never signs; ch8 is where five Heads and Bram Tull sign notes
      in the Headmaster's own margin, and that reveal is why the ch3-ch7 notes stay anonymous.
    carriers:
      - {file: manuscript/ch2.md, phrase: "every chapter opens with one school's admissions page"}
      - {file: manuscript/ch3.md, phrase: "Maera Voss, Keeper of First Signals,"}
      - {file: manuscript/ch4.md, phrase: "Corin Ash, Master of the Clean No,"}
      - {file: manuscript/ch5.md, phrase: "Sera Quill, Keeper of Continuance,"}
      - {file: manuscript/ch6.md, phrase: "Irix Vale, Patternwright,"}
      - {file: manuscript/ch7.md, phrase: "Elian Cross, Keeper of the Walk-Away Terms,"}
      - {file: manuscript/ch8.md, phrase: "Thalen Orr, Keeper of the Far Game,"}
    forbidden:
      - "treatise"
    also_applied_in: >
      marginalia/insertions.py, which is the source the compiled chapters are built from: the six
      sign-offs appended to HANDBOOK, SIGNATURE emptied, and the three marginal notes rewritten.
      **The first run silently did only half of this.** The loop that appended the sign-offs
      searched the whole file for `    N: """`, matched the SIGNATURE dict because it sits above
      HANDBOOK, and the same run then replaced that dict wholesale — so the work was written and
      discarded in one pass while the script reported success. Fixed by anchoring the search
      inside HANDBOOK. Five of six handbooks now regenerate byte-identical; ch3 still differs by
      fourteen lines, which is DL-89 and predates this.

  - id: DL-86
    proposed_fact: >
      A verb does not arrive after a subject the reader can no longer hold, and a pronoun does
      not reach back across a sentence boundary into a subordinate clause for its noun.
    wrong_because: >
      The ledger read this mark as "deposits one" and flagged it partial, so only the tail was
      captured. Reading the sentence explains the tail. Forty-one words of subject run before the
      verb arrives, and the verb is a banking metaphor introduced at the moment it is used. Its
      object, "one", points back past a sentence boundary to "a piece of evidence" inside a
      relative clause. The mark is on the last two words because that is where the sentence
      finally fails, not where it went wrong.
    proof_mark: "p.81, '...deposits one.' [partial]"
    scope: >
      manuscript/ch3.md, the paragraph at what is now line 675, read in full on 2026-09-09.
      Not searched book-wide: the shape is a sentence-level defect rather than a stated fact, so
      a census of other sites needs cadence.py or antecedent.py rather than a phrase search, and
      neither flagged this one.
    carriers:
      - {file: manuscript/ch3.md, phrase: "with your nerve telling you to let it go, deposits one"}

  - id: DL-87
    fact: >
      ch3's "What You Take Out of the Forest" is rebuilt, not repaired. It names what the reader
      keeps from meeting the Controller: a critic traded for a referee whose rulebook is theirs.
    applied: "1 of 1"
    ruled_by: >
      Wendell, 2026-09-09: "the 'what you take out of the forest' section is almost word salad. I
      have no idea what it's saying how it's supposed to help the reader. We need to fix it."
      Then, across four rounds on the draft: the superlative is falsifiable and throws away what
      the chapter did; the negation gives a feeling agency; "what chooses is" is vague passive and
      hides that the chooser is you, earlier; "spend it" is an empty phrase; "the true sentence"
      and "the true one" are definite-article failures; and "the Alchemist" stays because it is a
      named title.
    superseded_proposed_fact: >
      The section needs rebuilding rather than repairing. Its marked sentences were reworded and
      the handwritten instruction against the whole section was not carried out.
    wrong_because: >
      This is the one mark that is not a sentence. Wendell wrote "Rework" by hand against the
      section, and five of its lines were separately highlighted. The five were changed in
      tranches t10 and t11 and the section note was read as their sum. **A note against a section
      is a scope, and applying it sentence by sentence is the same error as DL-78 one level up:**
      the ruling was applied where it was stated rather than where it reached.
    proof_mark: "p.83, handwritten 'Rework' against the whole section, plus five marked lines"
    scope: >
      manuscript/ch3.md, the section heading through the rule before the next SECTION anchor,
      read in full on 2026-09-09. Four spans below: the heading, and the three reworded lines
      still traceable to marks. The fourth marked line, "the read let all the way in", now reads
      "the reading let all the way in" and is not carried as a span because the rework changed it.
    carriers:
      - {file: manuscript/ch3.md, phrase: "### What You Take Out of the Forest"}
      - {file: manuscript/ch3.md, phrase: "You came into this section with a critic"}
      - {file: manuscript/ch3.md, phrase: "The Alchemist needs both."}
      - {file: manuscript/ch3.md, phrase: "She was no readier than she had been."}

  - id: DL-88
    fact: >
      The Oreve marginalia ends on an observation rather than on the annotator's estimate of how
      much the anecdote mattered to him. The invented particular stays; the hedge does not.
    applied: "1 of 1"
    ruled_by: >
      Wendell, 2026-09-09: "the real defect is the closing hedge 'I have thought about it more
      than is useful' commenting on the anecdote instead of ending it."
    superseded_proposed_fact: >
      Undetermined. The mark itself was unconfirmed.
    wrong_because: >
      The ledger flags this one `[?]`: a low-confidence read of the highlight, so it is not
      certain the line was marked at all. Two readings are available and they point opposite
      ways. Either the invented particular is doing nothing — eleven days is a number the passage
      never uses — or the closing hedge is the defect, since "I have thought about it more than
      is useful" comments on the anecdote instead of ending it. **The line is inside a marginalia
      block, which is a traveller's journal in another hand, and invented particulars are
      legitimate there in a way they are not in the teaching voice.** That is the argument for
      leaving it alone, and it is why this one cannot be ruled from the mark.
    proof_mark: "p.56, marginalia, 'We were there eleven days.' [?]"
    scope: >
      manuscript/ch3.md, the marginalia block at lines 92-101, read in full on 2026-09-09.
      The ledger's own standing offer applies: "Wendell: correct any misread line and I will fix
      the ledger." This candidate is the ledger asking.
    carriers:
      - {file: manuscript/ch3.md, phrase: "We were there eleven days. I have not seen it anywhere since."}

  - id: DL-89
    fact: >
      insertions.py holds the frame text the manuscript carries, --verify compares frames as well
      as body, and --strip refuses a chapter apply() cannot reproduce. The manuscript is
      authoritative and the source cannot silently win.
    applied: "8 of 8"
    ruled_by: >
      Panel, 2026-09-09, six of six, PANEL_WRITE_CONTRACT_OPEN_Q_6FACE: the manuscript is
      authoritative and insertions.py is regenerated from it rather than retired, on eight
      commits against forty-nine. Wendell, 2026-09-09: "let's do DL-89."
    superseded_proposed_fact: >
      marginalia/insertions.py is the source of the framed blocks and manuscript/*.md is the
      compiled result, so the two must agree. They do not, and running compile.py --apply today
      would silently revert edited prose in three chapters.
    wrong_because: >
      **--verify passes and the files still disagree.** The round-trip check strips every frame
      and compares the BODY, which is exactly the text that is identical; the divergence is
      inside the marginalia and handbook blocks, where the check does not look. Sixty differing
      lines across ch3, ch4 and ch8. The manuscript carries the newer text, including
      proof-mark reworks applied on 2026-09-09 straight into the compiled file, so
      insertions.py holds superseded wording and would win on the next --apply.
      Found 2026-09-09 while proving the DL-85 headers regenerate correctly. They do: zero of
      the sixty differing lines touch a treatise header. **The census was of my own change and
      it caught somebody else's.**
    scope: >
      strip_marginalia() then apply_chapter() on ch3 through ch8, compared byte for byte
      against the file on disk, run on 2026-09-09 and again against HEAD. All six chapters
      diverge at HEAD, so this predates today's work entirely. Not censused for front matter,
      back matter or ch2 and ch9.
    note: >
      **APPLIED 2026-09-09.** `--regen` rewrote 8 blocks in insertions.py from the manuscript,
      7 in ch3 and 1 in ch7, all of them proof-mark reworks the source would have reverted.
      `--verify` now compares frame text as well as body and would have failed on that
      divergence from the day it started. **`--strip` refuses a chapter apply() cannot
      reproduce, which is five of seven** — the guard sits on strip rather than apply because
      strip is what discards the authoritative copy; apply already refuses a chapter that still
      has its frames. **Idempotent --apply was attempted and abandoned:** the manuscript and
      apply() disagree about whitespace around a block, and reconciling that means rewriting the
      strip/apply contract under seven live chapters to buy a mode whose job finished in June.
      **Two stale anchors are known and left**, ch4's "The Skeptic, Up Close" and ch8's "The
      Damaged Self, Up Close", each now a paragraph above its block; contained by the refusal
      and recorded rather than patched, because the fix could not be proved by any check here.
    carriers:
      - {file: marginalia/insertions.py, phrase: "I look for two qualities, together or not at all"}
      - {file: marginalia/insertions.py, phrase: "We put in once at Oreve, a poor port."}
      - {file: marginalia/insertions.py, phrase: "leaving out whoever was wrong is how a case stops being a case"}
      - {file: marginalia/compile.py, phrase: "%d FRAME BLOCK(S) STALE"}
      - {file: marginalia/compile.py, phrase: "--strip is the destructive step"}
      - {file: marginalia/compile.py, phrase: "def fixed_point(ch):"}

