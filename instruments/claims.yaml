    carriers:
      - {file: manuscript/ch3.md, phrase: "Three years of nothing, in my own handwriting"}
      - {file: manuscript/ch5.md, phrase: "The ordering is his and the finding is mine"}
      - {file: manuscript/ch5.md, phrase: "I conducted the review."}
